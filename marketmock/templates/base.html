<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MarketMock Seller Center (TIRUAN)</title>
<style>
  body{font-family:system-ui,sans-serif;margin:0;background:#f5f6f8;color:#1c1f26}
  header{background:#1f3a5f;color:#fff;padding:12px 24px;display:flex;justify-content:space-between;align-items:center}
  header a{color:#cfe3ff}
  .banner{background:#fff3cd;color:#664d03;padding:6px 24px;font-size:13px}
  main{max-width:880px;margin:24px auto;padding:0 16px}
  .card{background:#fff;border:1px solid #dde1e7;border-radius:8px;padding:16px 20px;margin-bottom:16px}
  table{width:100%;border-collapse:collapse}
  th,td{text-align:left;padding:8px;border-bottom:1px solid #eceff3;font-size:14px}
  input,select,textarea,button{font:inherit;padding:8px;margin:4px 0}
  textarea{width:100%;min-height:120px;box-sizing:border-box}
  button,.btn{background:#1f6feb;color:#fff;border:0;border-radius:6px;padding:8px 14px;text-decoration:none;cursor:pointer;display:inline-block}
  .err{color:#b42318;margin:8px 0}
  .form-col{display:flex;flex-direction:column}
  .form-col.rev{flex-direction:column-reverse}
  .badge{padding:2px 8px;border-radius:10px;background:#eef2ff;font-size:12px}
  .warn{color:#b54708;font-weight:600}
</style>
</head>
<body>
<header>
  <strong>MarketMock Seller Center</strong>
  {% if session.auth %}<a href="/logout" {{ tid('logout') }}>Keluar</a>{% endif %}
</header>
<div class="banner">DEMO: situs tiruan fiktif. Semua data dummy. Bukan platform marketplace asli.</div>
<main>{% block body %}{% endblock %}</main>
</body>
</html>
